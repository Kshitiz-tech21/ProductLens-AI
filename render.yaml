services:
  - type: web
    name: productlens-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install numpy==1.26.4 pandas==2.2.1 scipy==1.12.0 scikit-learn==1.4.1.post1 && pip install --no-deps langchain-core==0.2.43 langgraph==0.0.69 langchain==0.2.0 langchain-openai==0.1.0 && pip install fastapi==0.110.0 uvicorn==0.27.1 sqlalchemy==2.0.27 psycopg2-binary==2.9.9 pydantic==2.6.1 pydantic-settings==2.2.1 python-multipart==0.0.9
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BUILD_ID
        value: "v4-linear-install"
      - key: DATABASE_URL
        fromDatabase:
          name: productlens-db
          property: connectionString
      - key: AI_PROVIDER
        value: demo
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: productlens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Must be set manually or updated after backend is provisioned

databases:
  - name: productlens-db
    plan: free
    databaseName: productlens
    user: productlens_user
