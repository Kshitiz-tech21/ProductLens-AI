services:
  - type: web
    name: productlens-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: productlens-db
          property: connectionString
      - key: AI_PROVIDER
        value: demo
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: productlens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Must be set manually or updated after backend is provisioned

databases:
  - name: productlens-db
    plan: free
    databaseName: productlens
    user: productlens_user
